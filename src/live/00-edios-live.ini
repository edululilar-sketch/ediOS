# ediOS Live-System: "ediOS installieren" als erstes Symbol im Dock, keine Bildschirmsperre
[org/gnome/shell]
favorite-apps=['edios-install.desktop', 'firefox.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.TextEditor.desktop', 'org.edios.Apps.desktop', 'org.gnome.Settings.desktop']

[org/gnome/desktop/screensaver]
lock-enabled=false

[org/gnome/desktop/session]
idle-delay=uint32 0
