# Anmeldebildschirm (GDM): Schrift und kleines ediOS-Logo unten mittig.
# GNOME setzt das Logo immer an den unteren Rand (unter Passwortfeld und Benutzerliste).
# Das Bild (48 px hoch) kommt aus dem Paket edios-gdm-theme.
[org/gnome/desktop/interface]
clock-show-weekday=true
font-name='OpenDyslexic 9'

[org/gnome/login-screen]
logo='/usr/share/edios/gdm/edios-logo-login.png'
