# ediOS Desktop-Voreinstellungen (GNOME/Adwaita-Icons, Yaru-Fensterstil). GPL-3.0-or-later. Werden beim Bau zu /etc/dconf/db/local kompiliert.

[org/gnome/desktop/interface]
clock-show-weekday=true
gtk-theme='Yaru'
icon-theme='Adwaita'
cursor-theme='Adwaita'
font-name='OpenDyslexic 9'
document-font-name='OpenDyslexic 9'
# Terminal und Code: immer eine Monospace-Schrift (die ediOS-Einrichtung aendert sie nie)
monospace-font-name='Adwaita Mono 11'
color-scheme='default'
accent-color='orange'
enable-hot-corners=false

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
titlebar-font='OpenDyslexic Bold 9'

[org/gnome/desktop/background]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/edios/edios-wallpaper.png'
picture-uri-dark='file:///usr/share/backgrounds/edios/edios-wallpaper.png'
primary-color='#77216F'
secondary-color='#2C001E'
color-shading-type='vertical'

# Sperrbildschirm im laufenden System: ediOS-Wallpaper (GNOME zeichnet es selbst weich und dunkelt ab,
# das passt zum vorberechneten Bild des Anmeldebildschirms)
[org/gnome/desktop/screensaver]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/edios/edios-wallpaper.png'
primary-color='#0a0c18'
secondary-color='#0a0c18'

# Ausschalten, Neustart und Abmelden ohne Rueckfrage mit 60-s-Countdown (Programme mit ungesicherten
# Aenderungen melden sich trotzdem, dann erscheint der Dialog)
[org/gnome/gnome-session]
logout-prompt=false

# Updates nur ueber "ediOS aktualisieren": GNOME Software soll keine eigenen Update-Hinweise zeigen
# (sein apk-Plugin braucht apk-polkit-server, den ediOS nicht nutzt). Apps installieren geht weiter.
[org/gnome/software]
allow-updates=false
download-updates=false
download-updates-notify=false

[org/gnome/desktop/peripherals/touchpad]
tap-to-click=true

# Ziffernblock beim Start an (GNOME merkt sich danach den letzten Zustand)
[org/gnome/desktop/peripherals/keyboard]
numlock-state=true
remember-numlock-state=true

# Warnung bei wenig Speicherplatz: unter 10 % frei (GNOME-Vorgabe: unter 5 % UND unter 1 GB).
# free-size-gb-no-notify sehr gross = die GB-Grenze spielt keine Rolle.
[org/gnome/settings-daemon/plugins/housekeeping]
free-percent-notify=0.1
free-size-gb-no-notify=1000000

[org/gnome/shell]
enabled-extensions=['dash-to-dock@micxgx.gmail.com', 'appindicatorsupport@rgcjonas.gmail.com', 'edios-session@edios']
favorite-apps=['firefox.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.TextEditor.desktop', 'org.edios.Apps.desktop', 'org.gnome.Settings.desktop']

# Dock links, immer sichtbar
[org/gnome/shell/extensions/dash-to-dock]
dock-position='LEFT'
extend-height=true
dock-fixed=true
autohide=false
intellihide=false
dash-max-icon-size=48
click-action='focus-minimize-or-previews'
show-trash=true
show-mounts=true
show-apps-at-top=false
running-indicator-style='DOTS'
transparency-mode='DEFAULT'
apply-custom-theme=false
custom-theme-shrink=true

# --- Terminal: gnome-terminal ist das einzige Terminal ---
[org/gnome/desktop/default-applications/terminal]
exec='gnome-terminal'
exec-arg='--'

# Tastenkuerzel (wie unter Windows): Super+E Dateien, Strg+Umschalt+Esc Systemmonitor, Strg+Alt+T Terminal.
# Druck (Bildschirmfoto) und Super+L (Sperren) sind GNOME-Vorgaben und bleiben so.
[org/gnome/settings-daemon/plugins/media-keys]
home=['<Super>e']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/edios-terminal/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/edios-systemmonitor/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/edios-systemmonitor]
name='System Monitor'
command='gnome-system-monitor'
binding='<Control><Shift>Escape'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/edios-terminal]
name='Terminal'
command='gnome-terminal'
binding='<Control><Alt>t'

# Dunkles ediOS-Profil (lila/blau). b1dcc9dd-... ist die feste ID des Standardprofils von gnome-terminal.
[org/gnome/terminal/legacy]
theme-variant='dark'
default-show-menubar=false

[org/gnome/terminal/legacy/profiles:]
list=['b1dcc9dd-5262-4d8d-a863-c897e6d979b9']
default='b1dcc9dd-5262-4d8d-a863-c897e6d979b9'

[org/gnome/terminal/legacy/profiles:/:b1dcc9dd-5262-4d8d-a863-c897e6d979b9]
visible-name='ediOS'
use-system-font=false
font='Adwaita Mono 11'
default-size-columns=100
default-size-rows=28
use-theme-colors=false
background-color='#1b1830'
foreground-color='#e6e2f5'
bold-color-same-as-fg=true
cursor-colors-set=true
cursor-background-color='#a78bfa'
cursor-foreground-color='#1b1830'
highlight-colors-set=true
highlight-background-color='#4f6dff'
highlight-foreground-color='#ffffff'
palette=['#2a2640', '#f2557a', '#4ade80', '#fbbf24', '#60a5fa', '#c084fc', '#22d3ee', '#cbc6e0', '#5a5478', '#ff7a9a', '#86efac', '#fde68a', '#93c5fd', '#d8b4fe', '#67e8f9', '#f5f3ff']
audible-bell=false

# Datei-Indexer (localsearch) aus: kein Durchsuchen, keine Ueberwachung, keine Ordner
[org/freedesktop/tracker/miner/files]
crawling-interval=-2
enable-monitors=false
index-recursive-directories=@as []
index-single-directories=@as []
# falls doch jemand Ordner einschaltet: gedrosselt, nicht auf Akku, keine Wechselmedien
throttle=20
index-on-battery=false
index-on-battery-first-time=false
index-removable-devices=false
index-optical-discs=false
