
# --- ediOS: Hilfe, falls der Start mit Secure Boot scheitert / help if starting with Secure Boot fails ---
# Der ediOS-Eintrag ruft das auf, wenn GRUB den Kernel nicht laden darf (statt nur
# "you need to load the kernel first"). GRUB zeigt hier nur ASCII (keine Umlaute).
function edios_sb_hilfe {
	echo ""
	echo "  ================================================================"
	echo "   Secure Boot: ediOS konnte nicht gestartet werden."
	echo "   Secure Boot: ediOS could not be started."
	echo ""
	echo "   DE: Bitte den ediOS-Schluessel eintragen ODER Secure Boot im"
	echo "       BIOS/UEFI-Setup ausschalten. Schluessel eintragen: im"
	echo "       Startmenue 'ediOS-Schluessel eintragen' waehlen, dann:"
	echo "   EN: Please enroll the ediOS key OR turn off Secure Boot in the"
	echo "       BIOS/UEFI setup. To enroll the key choose 'Enroll ediOS key'"
	echo "       in the boot menu, then:"
	echo ""
	echo "     Enroll key from disk > EDIOS > edios-mok.der"
	echo "     > Continue > Yes > Reboot"
	echo ""
	echo "   Anleitung / guide: github.com/edululilar-sketch/ediOS"
	echo "  ================================================================"
	echo ""
	echo "   Enter: zurueck zum Startmenue / back to the boot menu ..."
	read edios_taste
}
